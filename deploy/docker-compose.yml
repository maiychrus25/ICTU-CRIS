# Triển khai một máy: PostgreSQL + ICTU-CRIS (web). Cấu hình qua deploy/.env
# (tạo bằng deploy/setup.sh). Ảnh app dựng từ mã nguồn ở thư mục gốc, hoặc thay
# `build` bằng `image: ghcr.io/maiychrus25/ictu-cris:0.6.0` để dùng ảnh phát hành
# (hậu tố `-ai`, ví dụ `:0.3.0-ai`, đã cài sẵn thư viện AI cho CRIS_AI_PROVIDER=local).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt trong deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cris}
    volumes:
      - cris_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cris} -d ${POSTGRES_DB:-cris}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      args:
        EXTRAS: ${CRIS_EXTRAS:-}          # "[ai]" để cài thư viện AI vào ảnh
    image: ictu-cris:local
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cris}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cris}
      CRIS_AI_PROVIDER: ${CRIS_AI_PROVIDER:-none}
      CRIS_AI_MODEL_DIR: /models
    volumes:
      - cris_models:/models                # mô hình AI tải một lần, giữ qua các lần dựng lại
      - cris_data:/data                    # tệp minh chứng (CRIS_DATA_DIR)
    ports:
      - "${CRIS_PORT:-8000}:8000"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  cris_pg: {}
  cris_models: {}
  cris_data: {}

# Cài: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--select", "E9,F63,F7,F82"]
  - repo: local
    hooks:
      - id: spdx-header
        name: Header SPDX trên tệp .py/.sql/.sh/.yml
        entry: python scripts/check_spdx.py
        language: system
        files: '\.(py|sql|sh|yml|yaml)$'
  - repo: local
    hooks:
      - id: no-ai-trailer
        name: Thông điệp commit không có dòng ghi công AI
        entry: python3 scripts/check_commit_trailers.py --file
        language: system
        stages: [commit-msg]

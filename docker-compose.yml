services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cris
      POSTGRES_PASSWORD: cris
      POSTGRES_DB: cris
    ports: ["5432:5432"]
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
      - cris_pg:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://cris:cris@db:5432/cris
    depends_on: [db]
    profiles: ["app"]
volumes:
  cris_pg: {}

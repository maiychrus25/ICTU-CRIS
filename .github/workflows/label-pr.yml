# Label PR — gắn nhãn theo đường dẫn thay đổi, cấu hình ở .github/labeler.yml
name: Label PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Gắn nhãn theo đường dẫn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

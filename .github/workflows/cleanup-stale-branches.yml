#
# Dọn nhánh không hoạt động quá 90 ngày, chạy sáng Chủ nhật; mặc định chỉ liệt kê
# (dry run) — muốn xoá thật thì chạy tay với dry_run=false.
name: Cleanup Stale Branches

on:
  schedule:
    - cron: "0 19 * * 0"        # 02:00 Chủ nhật giờ Việt Nam
  workflow_dispatch:
    inputs:
      days_inactive: { description: "Số ngày không hoạt động", default: "90" }
      dry_run: { description: "Chỉ liệt kê, không xoá", type: choice, options: ["true", "false"], default: "true" }

permissions:
  contents: write

jobs:
  cleanup:
    name: Liệt kê / xoá nhánh cũ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env:
          DAYS: ${{ github.event.inputs.days_inactive || '90' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          cutoff=$(( $(date +%s) - DAYS*86400 ))
          echo "ngưỡng: $DAYS ngày · dry_run=$DRY_RUN"
          for ref in $(git branch -r | grep -v HEAD | sed 's#  origin/##'); do
            case "$ref" in main|develop|release/*|hotfix/*) echo "🔒 giữ: $ref"; continue;; esac
            last=$(git log -1 --format=%ct "origin/$ref" 2>/dev/null || echo 0)
            if [ "$last" -lt "$cutoff" ]; then
              echo "🧹 cũ ($(date -d @$last +%F)): $ref"
              [ "$DRY_RUN" = "false" ] && git push origin --delete "$ref"
            fi
          done

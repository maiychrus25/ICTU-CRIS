# Docker — dựng ảnh và đẩy lên GHCR: ghcr.io/maiychrus25/ictu-cris
#   main            → :latest, :main, :sha-<7 ký tự>
#   tag vX.Y.Z      → :X.Y.Z, :X.Y, :latest
#   pull request    → chỉ dựng, không đẩy
# Ảnh có nhãn OCI (nguồn, giấy phép, phiên bản) do docker/metadata-action sinh.
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, pyproject.toml, "cris/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/maiychrus25/ictu-cris

jobs:
  image:
    name: Dựng và đẩy ảnh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Đăng nhập GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ICTU-CRIS
            org.opencontainers.image.licenses=Apache-2.0
      - name: Ảnh gọn (không thư viện AI)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Biến thể "-ai": cài extra [ai] (onnxruntime, tokenizers, numpy) để chạy
      # CRIS_AI_PROVIDER=local mà không phải build trên máy chủ.
      - id: meta_ai
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=-ai,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Ảnh có thư viện AI (hậu tố -ai)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            EXTRAS=[ai]
          tags: ${{ steps.meta_ai.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

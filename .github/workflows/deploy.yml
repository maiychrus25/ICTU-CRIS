#
# Deploy — khi một GitHub Release được công bố (hoặc chạy tay với một tag), chờ
# ảnh "-ai" tương ứng có mặt trên GHCR (docker.yml dựng ảnh chạy song song khi
# tag được đẩy) rồi SSH vào máy chủ thật chạy deploy/upgrade.sh <tag> — script
# đó tự sao lưu CSDL, migrate, đổi ảnh, kiểm tra /api/health, và tự khôi phục
# nếu health check thất bại. Không dùng action SSH bên thứ ba — chỉ ssh thuần.
#
# Secrets cần tạo trước (Settings → Environments → production, hoặc repo
# secrets): PROD_HOST, PROD_USER, PROD_SSH_KEY (khoá riêng ed25519 của user
# `deploy` trên máy chủ), PROD_KNOWN_HOSTS (host key của máy chủ, dạng
# `ssh-keyscan`). Xem docs/deploy-prod.md.
name: Deploy

# Lưu ý: Release do release.yml tạo bằng GITHUB_TOKEN nên sự kiện `release: published`
# KHÔNG kích hoạt workflow khác (giới hạn của GitHub). Vì vậy kích hoạt theo tag đẩy lên.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag đã phát hành cần triển khai (ví dụ v0.3.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  wait-image:
    name: Chờ ảnh -ai trên GHCR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Xác định tag cần triển khai
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          [ -z "$TAG" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ] && TAG="$GITHUB_REF_NAME"
          if [ -z "$TAG" ]; then
            echo "::error::không xác định được tag (release.tag_name hoặc workflow_dispatch.tag)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Chờ ảnh ghcr.io/maiychrus25/ictu-cris:<phiên bản>-ai (tối đa 5 phút)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VER="${TAG#v}"
          IMG="ghcr.io/maiychrus25/ictu-cris:${VER}-ai"
          echo "chờ ${IMG} (docker.yml dựng ảnh này song song khi tag được đẩy) ..."
          for i in $(seq 1 10); do
            if docker manifest inspect "$IMG" >/dev/null 2>&1; then
              echo "có ảnh sau $(( (i - 1) * 30 ))s"
              exit 0
            fi
            echo "  chưa có (lần $i/10) — chờ 30s"
            sleep 30
          done
          # Không chặn: upgrade.sh trên máy chủ tự dựng ảnh từ mã nguồn khi GHCR
          # chưa có (ví dụ tag phát hành trước khi docker.yml có biến thể -ai).
          echo "::warning::không thấy ${IMG} trên GHCR sau 5 phút — máy chủ sẽ tự dựng ảnh (hoặc dùng ảnh local sẵn có)"
          exit 0

  deploy:
    name: Triển khai lên máy chủ thật
    needs: wait-image
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-prod
    env:
      TAG: ${{ needs.wait-image.outputs.tag }}
    steps:
      - name: Cài khoá SSH và known_hosts
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Kiểm tra secrets trước khi kết nối
        run: |
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::PROD_SSH_KEY không phải khoá riêng hợp lệ — dán nguyên nội dung tệp khoá riêng (bắt đầu bằng '-----BEGIN OPENSSH PRIVATE KEY-----'), không phải tệp .pub"
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ] || ! grep -q "${{ secrets.PROD_HOST }}" ~/.ssh/known_hosts; then
            echo "::warning::PROD_KNOWN_HOSTS trống hoặc không chứa PROD_HOST — lấy host key trực tiếp bằng ssh-keyscan (kém an toàn hơn, chỉ để không chặn)"
            ssh-keyscan -T 10 "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=20 "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" 'echo "ssh OK: $(id -un)@$(hostname)"' \
            || { echo "::error::không SSH được tới ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} — kiểm PROD_USER/PROD_HOST, khoá công khai trong authorized_keys, tường lửa cổng 22"; exit 1; }
      - name: Chạy deploy/upgrade.sh trên máy chủ thật
        run: |
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
            "bash /opt/ictu-cris/deploy/upgrade.sh '${TAG}'"
      - name: Kiểm tra nhanh (smoke test)
        run: |
          curl -fsS https://cris.ahvlabs.com/api/health
          echo
          curl -fsS https://cris.ahvlabs.com/api/about \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); print("works:", d.get("works"))'

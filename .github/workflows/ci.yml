# CI — lint (chỉ chặn lỗi cú pháp/tên chưa định nghĩa), test trên PostgreSQL thật
# với hai phiên bản Python, giao diện Next.js (lint/kiểu/build/e2e), quét lỗ hổng
# thư viện (không chặn), dựng gói và ảnh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff
      - name: Lỗi cú pháp và tên chưa định nghĩa (chặn)
        run: ruff check cris tests scripts --select E9,F63,F7,F82 --output-format=github
      - name: Cảnh báo còn lại (không chặn)
        run: ruff check cris tests scripts --exit-zero --statistics

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: cris, POSTGRES_PASSWORD: cris, POSTGRES_DB: cris_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cris" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cris:cris@localhost:5432/cris_test
      DATABASE_URL: postgresql://cris:cris@localhost:5432/cris_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      # [ai] cần cho test đối chiếu/gom cụm/gợi ý (numpy) dù provider là fake;
      # test dùng mô hình thật vẫn bị bỏ qua qua -m "not slow".
      - run: pip install -e ".[dev,ai]"
      - name: pytest (bỏ qua test cần mô hình AI)
        run: pytest -v -m "not slow" --junitxml=junit-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python }}
          path: junit-*.xml
          retention-days: 14

  audit:
    name: Quét lỗ hổng thư viện
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip install -e ".[ai]"
      - name: pip-audit (không chặn — báo để xử lý)
        run: pip-audit --progress-spinner off || echo "::warning::pip-audit phát hiện lỗ hổng, xem log"

  frontend:
    name: Giao diện (lint, kiểu, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Xuất tĩnh (out/)
        run: npm run build
      - name: Playwright (dữ liệu mẫu, không cần backend)
        run: npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  build:
    name: Dựng gói và ảnh Docker (không đẩy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build && ls -la dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: "cris:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
